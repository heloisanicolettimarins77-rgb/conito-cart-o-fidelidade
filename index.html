    --marrom:#702F0D;
    --marrom-escuro:#40190A;
    --creme:#FDF0DE;
    --pessego:#FCBB6A;
    --laranja:#F67B29;
    --amarelo:#FCBB2F;
    --rosa:#FD549B;
    --roxo:#A967D3;
    --vermelho:#EE2F44;
    --verde:#92BF46;
    --azul:#5AB4F4;

    --fundo:#FDF0DE;
    --superficie:#FFFAF2;
    --texto:#702F0D;
    --texto-suave:rgba(112,47,13,.68);
    --linha:rgba(112,47,13,.22);
    --botao-fundo:#702F0D;
    --botao-texto:#FDF0DE;
    --selo-cheio:#702F0D;
    --granulado-opacidade:.3;
    --sombra:0 1px 0 rgba(112,47,13,.08), 0 10px 24px -18px rgba(112,47,13,.5);
    --raio:18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fundo:#2A1409; --superficie:#3B1E0E; --texto:#FDF0DE;
      --texto-suave:rgba(253,240,222,.7); --linha:rgba(253,240,222,.24);
      --botao-fundo:#FCBB2F; --botao-texto:#40190A; --selo-cheio:#5C2F12;
      --granulado-opacidade:.4;
      --sombra:0 1px 0 rgba(0,0,0,.4), 0 10px 24px -18px #000;
    }
  }
  :root[data-theme="dark"]{
    --fundo:#2A1409; --superficie:#3B1E0E; --texto:#FDF0DE;
    --texto-suave:rgba(253,240,222,.7); --linha:rgba(253,240,222,.24);
    --botao-fundo:#FCBB2F; --botao-texto:#40190A; --selo-cheio:#5C2F12;
    --granulado-opacidade:.4;
    --sombra:0 1px 0 rgba(0,0,0,.4), 0 10px 24px -18px #000;
  }

  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0;padding:0}
  body{
    background:var(--fundo); color:var(--texto);
    font-family:"Nunito Sans",system-ui,-apple-system,sans-serif;
    font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
    min-height:100vh; display:flex; flex-direction:column;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:var(--granulado);background-size:150px 150px;
    opacity:var(--granulado-opacidade);
  }
  .topo,main,.rodape{position:relative;z-index:1}

  .topo{
    position:sticky; top:0; z-index:5;
    background:var(--fundo);
    border-bottom:2px solid var(--linha);
    padding-top:env(safe-area-inset-top,0px);
  }
  .topo-interno{
    max-width:560px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:12px;
  }
  .marca-selo{
    background:#FDF0DE;border-radius:999px;padding:7px 16px;
    display:inline-flex;align-items:center;flex:none;
  }
  .marca-logo{
    width:132px;height:38px;display:block;
    background-image:var(--logo);background-size:contain;
    background-repeat:no-repeat;background-position:center;
  }
  .etiqueta{
    font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--marrom-escuro);background:var(--amarelo);border:none;
    border-radius:999px;padding:6px 12px;white-space:nowrap;
  }

  main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:24px 20px 40px}

  .rodape{
    border-top:1px solid var(--linha);
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
    text-align:center;font-size:14px;color:var(--texto-suave);
  }
  .rodape p{margin:0 0 6px;color:inherit}

  h2{font-family:"Fredoka",sans-serif;font-weight:600;font-size:27px;line-height:1.12;margin:0 0 8px;letter-spacing:-.01em}
  h3{font-family:"Fredoka",sans-serif;font-weight:500;font-size:17px;margin:26px 0 10px;color:var(--texto-suave)}
  p{margin:0 0 16px;color:var(--texto-suave)}

  .hero{margin-bottom:26px}
  .hero h2{font-size:34px}
  .hero .sub{font-size:18px}

  .comunidade{
    background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:22px 18px;margin:26px 0 8px;text-align:center;
  }
  .comunidade h3{margin:0 0 6px;color:var(--texto);font-size:21px;font-weight:600}
  .comunidade p{margin:0 0 16px;font-size:15px}
  .qr{
    width:188px;margin:0 auto 14px;padding:10px;background:#fff;border-radius:14px;
    display:grid;place-items:center;
  }
  .qr img,.qr canvas{display:block;width:168px;height:168px}
  .qr-aviso{font-size:12px;color:var(--texto-suave);margin:0}
  .vitrine{
    background:var(--superficie);border:2px solid var(--texto);border-radius:var(--raio);
    box-shadow:var(--sombra);padding:18px 16px;margin:22px 0 4px;
  }
  .vitrine .selos{margin-bottom:12px}
  .vitrine p{margin:0;font-size:15px;text-align:center;color:var(--texto)}
  .vitrine p b{font-weight:700}
  .passos{display:grid;gap:10px;margin:22px 0 8px}
  .passo{display:flex;gap:13px;align-items:flex-start}
  .passo b{
    flex:none;width:30px;height:30px;border-radius:50%;background:var(--amarelo);color:var(--marrom-escuro);
    display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-size:16px;font-weight:600;
  }
  .passo span{font-size:16px;color:var(--texto-suave);padding-top:3px}
  .passo span i{font-style:normal;color:var(--texto);font-weight:700}

  .cartao{
    position:relative;background:var(--superficie);
    border:2px solid var(--texto);border-radius:var(--raio);
    padding:20px 18px 18px;box-shadow:var(--sombra);margin:18px 0;overflow:hidden;
  }
  .cartao::after{content:"";position:absolute;left:0;right:0;bottom:44px;border-top:2px dashed var(--linha)}
  .cartao-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .cartao-nome{font-family:"Fredoka",sans-serif;font-size:22px;font-weight:600;margin:0;line-height:1.1}
  .cartao-tel{font-size:13px;color:var(--texto-suave);margin:2px 0 0;font-variant-numeric:tabular-nums}
  .contagem{font-family:"Fredoka",sans-serif;font-weight:600;font-size:28px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .contagem small{font-size:15px;font-weight:500;color:var(--texto-suave)}

  .selos{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:16px}
  .selo{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--linha)}
  .selo.cheio{border:2px solid transparent;background:var(--selo-cheio)}
  .selo svg{width:62%;height:62%;display:block}
  .selo.vazio svg{display:none}

  .rodape-cartao{padding-top:14px;height:44px;display:flex;align-items:center;font-size:15px;color:var(--texto-suave)}
  .rodape-cartao b{color:var(--texto)}

  .cartao.premiado{border-color:var(--marrom);background:var(--rosa)}
  .cartao.premiado .cartao-nome,.cartao.premiado .contagem,.cartao.premiado .rodape-cartao b{color:var(--marrom-escuro)}
  .cartao.premiado .cartao-tel,.cartao.premiado .contagem small,.cartao.premiado .rodape-cartao{color:rgba(64,25,10,.8)}
  .cartao.premiado::after{border-top-color:rgba(64,25,10,.35)}
  .cartao.premiado .selo{border-color:rgba(64,25,10,.5)}
  .cartao.premiado .selo.cheio{background:var(--creme)}

  .botao{
    display:block;width:100%;border:none;border-radius:14px;
    font-family:"Fredoka",sans-serif;font-size:19px;font-weight:600;
    padding:17px 18px;margin-bottom:10px;cursor:pointer;
    background:var(--botao-fundo);color:var(--botao-texto);
    text-align:center;line-height:1.2;text-decoration:none;
  }
  .botao.premio{background:var(--rosa);color:var(--marrom-escuro)}
  .botao.zap{background:var(--verde);color:var(--marrom-escuro)}
  .botao.contorno{background:transparent;color:var(--texto);border:2px solid var(--linha);font-weight:500}
  .botao.grande{font-size:22px;padding:21px 18px}
  .botao:disabled{opacity:.45;cursor:default}
  .botao:focus-visible,input:focus-visible,textarea:focus-visible,.link:focus-visible,.item:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}

  .link{background:none;border:none;padding:10px 4px;margin:0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--texto-suave);text-decoration:underline;text-underline-offset:3px}
  .centro{text-align:center}

  label{display:block;font-size:15px;font-weight:700;margin:0 0 6px}
  input{width:100%;padding:16px 14px;font-size:19px;font-family:inherit;border:2px solid var(--linha);border-radius:14px;background:var(--superficie);color:var(--texto);margin-bottom:14px}
  input::placeholder{color:var(--texto-suave);opacity:.7}
  textarea{
    width:100%;padding:14px;font-size:16px;font-family:inherit;line-height:1.45;
    border:2px solid var(--linha);border-radius:14px;background:var(--superficie);
    color:var(--texto);margin-bottom:10px;min-height:160px;resize:vertical;
  }

  .resumo{display:flex;gap:10px;margin-bottom:18px}
  .resumo div{flex:1;background:var(--superficie);border:1px solid var(--linha);border-radius:14px;padding:13px 15px;box-shadow:var(--sombra)}
  .resumo b{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:27px;line-height:1.1}
  .resumo span{font-size:13px;color:var(--texto-suave)}
  .resumo .destaque{background:var(--rosa);border-color:var(--rosa)}
  .resumo .destaque b,.resumo .destaque span{color:var(--marrom-escuro)}

  .lista{list-style:none;margin:0 0 16px;padding:0}
  .lista li{margin-bottom:8px}
  .item{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:var(--superficie);border:1px solid var(--linha);border-radius:14px;padding:14px;cursor:pointer;font-family:inherit;font-size:17px;color:var(--texto);box-shadow:var(--sombra)}
  .item.pronto{border:2px solid var(--rosa)}
  .item-nome{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-tel{font-size:13px;font-weight:400;color:var(--texto-suave);display:block}
  .item-num{font-family:"Fredoka",sans-serif;font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .item.pronto .item-num{background:var(--rosa);color:var(--marrom-escuro);border-radius:999px;padding:4px 10px}

  .aviso{border-left:4px solid var(--amarelo);padding:10px 0 10px 12px;margin:0 0 16px;font-size:15px;color:var(--texto)}
  .aviso.ruim{border-left-color:var(--vermelho)}
  .aviso .botao{margin-top:10px}
  .codigo{display:block;margin-top:6px;font-size:12px;color:var(--texto-suave);font-family:ui-monospace,monospace}
  .barra{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .barra h2{margin:0}
  @media (prefers-reduced-motion: no-preference){
    .cartao.premiado{animation:pulo .45s ease-out}
    @keyframes pulo{from{transform:scale(.96)}to{transform:scale(1)}}
  }
</style>
</head>

<footer class="rodape">
  <p>Conito Doces</p>
  <button class="link" data-ir="admin">Área do administrador</button>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";

  var cfg = window.CONITO_CONFIG || {};
  var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);

  var app = document.getElementById("app");
  var estado = { meta:{ alvo:10, link:"", comunidade:"" }, clientes:[] };
  var meuCartao = null;      // cartão da cliente (visão pública)
  var carregando = false;
  var salvando = false;
  var recado = null;
  var autenticado = false;
  var emailAdm = "";
  var tela = {nome:"inicio"};
  var ultimaTela = null;

  /* ---------- utilidades ---------- */

  function digitos(s){ return String(s||"").replace(/\D/g,""); }

  function chave(tel){
    var d = digitos(tel); if(d.length < 8) return "";
    if(d.length > 11 && d.indexOf("55") === 0) d = d.slice(2);
    var h = 0x811c9dc5;
    for(var i=0;i<d.length;i++){ h ^= d.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    return ("0000000" + h.toString(16)).slice(-8) + d.length;
  }

  function telLimpo(tel){
    var d = digitos(tel);
    if(d.length > 11 && d.indexOf("55") === 0) d = d.slice(2);
    return d;
  }

  function local(k, v){
    try{ if(v === undefined) return window.localStorage.getItem(k); window.localStorage.setItem(k, v); }catch(e){}
    return null;
  }

  function achar(k){
    for(var i=0;i<estado.clientes.length;i++) if(estado.clientes[i].k === k) return estado.clientes[i];
    return null;
  }

  function deBanco(r){
    return { k:r.k, nome:r.nome||"", t4:r.t4||"", tel:r.tel||"", selos:r.selos||0,
             resgates:r.resgates||0, em: r.em ? new Date(r.em).getTime() : 0 };
  }

  function erroTexto(err){
    return "Não consegui salvar agora. Confere a internet e tenta de novo." +
      (err && err.message ? " (" + err.message + ")" : "");
  }

  /* ---------- banco ---------- */

  async function carregarConfig(){
    var r = await sb.from("config").select("alvo,link,comunidade").eq("id",1).maybeSingle();
    if(r.data){
      estado.meta.alvo = Number(r.data.alvo) > 0 ? Number(r.data.alvo) : 10;
      estado.meta.link = r.data.link || "";
      estado.meta.comunidade = r.data.comunidade || "";
    }
  }

  async function carregarClientes(){
    var r = await sb.from("clientes").select("*").order("em", {ascending:false});
    if(r.error){ recado = {texto:"Não consegui carregar as clientes: " + r.error.message}; return; }
    estado.clientes = (r.data || []).map(deBanco);
  }

  async function verificarAdmin(){
    var s = await sb.auth.getSession();
    var sessao = s.data && s.data.session;
    if(!sessao){ autenticado = false; emailAdm = ""; return; }
    var r = await sb.rpc("sou_admin");
    autenticado = !r.error && r.data === true;
    emailAdm = sessao.user.email || "";
    if(!autenticado){
      await sb.auth.signOut();
      recado = {texto:"Esse e-mail não está liberado como administrador."};
    }
  }

  async function consultarCartao(k){
    var r = await sb.rpc("consultar_cartao", {p_k:k});
    if(r.error || !r.data || !r.data.length) return null;
    var c = r.data[0];
    return { k:k, nome:c.nome||"", t4:c.t4||"", selos:c.selos||0, resgates:c.resgates||0 };
  }

  async function atualizar(k, campos, texto){
    salvando = true; desenhar();
    campos.em = new Date().toISOString();
    var r = await sb.from("clientes").update(campos).eq("k", k).select().maybeSingle();
    salvando = false;
    if(r.error || !r.data){ recado = {texto:erroTexto(r.error)}; return desenhar(); }
    var novo = deBanco(r.data);
    for(var i=0;i<estado.clientes.length;i++) if(estado.clientes[i].k === k) estado.clientes[i] = novo;
    recado = {texto:texto};
    desenhar();
  }

  /* ---------- mensagens ---------- */

  var FALAS = {
    1: "Oi, {n}! Seu cartão da Conito tá criado 🍦\nJá tem 1 de {a} — comprou, marcou, ganhou. O de número {a} é por nossa conta.",
    2: "{n}, 2 de {a}.\nComeçou bem.",
    3: "3 de {a}, {n}.\nIsso já tá virando hábito.",
    4: "4 de {a}, {n}.\nQuase na metade do caminho.",
    5: "Metade, {n}! 5 de {a}.\nDaqui pra frente é descida.",
    6: "6 de {a}, {n}.\nA metade já ficou pra trás.",
    7: "7 de {a}, {n}!\nJá dá pra sentir o cheiro do grátis.",
    8: "Falta pouco, {n}: 8 de {a}.\nTá chegando.",
    9: "9 de {a}, {n}.\nFalta UM. Um!"
  };

  function linkPagina(){
    return estado.meta.link || (window.location.origin + window.location.pathname);
  }

  function mensagemPadrao(c){
    var alvo = estado.meta.alvo, tem = Math.min(c.selos, alvo), faltam = alvo - c.selos;
    var primeiro = (c.nome || "").split(" ")[0];
    var corpo;
    if(tem >= alvo){
      corpo = "Parabéns, {n}! 🍦\nSeu conito grátis tá liberado. Passa aqui pra buscar.";
    }else if(tem === 1 && c.resgates > 0){
      corpo = "{n}, cartão novo em folha: 1 de {a}.\nBora de novo?";
    }else if(alvo === 10 && FALAS[tem]){
      corpo = FALAS[tem];
    }else if(tem === 0){
      corpo = "Oi, {n}! Seu cartão da Conito tá zerado e pronto pro próximo.";
    }else{
      corpo = "Oi, {n}! Seu cartão tá em " + tem + " de {a}.\n" +
              (faltam === 1 ? "Falta UM. Um!" : "Faltam " + faltam + ". Tá chegando.");
    }
    corpo = corpo.split("{n}").join(primeiro).split("{a}").join(alvo);
    corpo += "\n\nAcompanha aqui: " + linkPagina();
    if(estado.meta.comunidade) corpo += "\nE entra no Clube dos Conitos: " + estado.meta.comunidade;
    return corpo;
  }

  function linkZap(c, texto){
    var d = digitos(c.tel);
    if(!d) return "";
    if(d.length <= 11) d = "55" + d;
    return "https://wa.me/" + d + "?text=" + encodeURIComponent(texto || "");
  }

  /* ---------- pedaços ---------- */

  function escapar(s){
    return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
  }

  function svgConito(){
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#casquinha"/></svg>';
  }

  function cartaoHTML(c){
    var alvo = estado.meta.alvo, cheios = Math.min(c.selos, alvo), premiado = c.selos >= alvo, selos = "";
    for(var i=0;i<alvo;i++) selos += '<div class="selo ' + (i<cheios?"cheio":"vazio") + '">' + svgConito() + '</div>';
    var faltam = alvo - c.selos;
    var rodape = premiado ? "<b>Fechou. Seu conito grátis tá te esperando.</b>"
      : (faltam === 1 ? "Falta <b>1</b>. Tá quase." : "Faltam <b>" + faltam + "</b>. Tá chegando.");
    return '<div class="cartao' + (premiado?" premiado":"") + '">' +
      '<div class="cartao-topo"><div><p class="cartao-nome">' + escapar(c.nome) + '</p>' +
      (c.t4 ? '<p class="cartao-tel">•••• ' + escapar(c.t4) + '</p>' : '') + '</div>' +
      '<div class="contagem">' + cheios + '<small>/' + alvo + '</small></div></div>' +
      '<div class="selos">' + selos + '</div><div class="rodape-cartao"><span>' + rodape + '</span></div></div>';
  }

  function recadoHTML(){
    var h = "";
    if(salvando) h += '<p class="aviso">Salvando…</p>';
    if(carregando) h += '<p class="aviso">Carregando…</p>';
    if(recado){ h += '<p class="aviso">' + escapar(recado.texto) + '</p>'; recado = null; }
    return h;
  }

  /* ---------- telas ---------- */

  function desenhar(){
    var h = recadoHTML();
    var t = tela.nome;
    if(t === "inicio") h += telaInicio();
    else if(t === "entrar") h += telaEntrar();
    else if(t === "meu") h += telaMeu();
    else if(t === "admin") h += autenticado ? telaLoja() : telaLogin();
    else if(t === "ficha") h += telaFicha();
    else if(t === "novo") h += telaNovo();
    else if(t === "ajustes") h += telaAjustes();
    app.innerHTML = h;
    montarQR();
    if(tela.nome !== ultimaTela){ ultimaTela = tela.nome; window.scrollTo(0,0); }
    if(tela.focar){ var f = app.querySelector("[data-foco]"); if(f) f.focus(); tela.focar = false; }
  }

  function telaInicio(){
    var selos = "";
    for(var i=0;i<estado.meta.alvo;i++) selos += '<div class="selo cheio">' + svgConito() + '</div>';
    return '<div class="hero"><h2>Comprou, marcou, ganhou.</h2>' +
      '<p class="sub">Seu cartão fidelidade da Conito, direto no celular. Sem baixar app, sem senha, sem cadastro chato.</p></div>' +
      '<button class="botao grande" data-ir="entrar">Ver meu cartão</button>' +
      '<div class="vitrine"><div class="selos">' + selos + '</div>' +
      '<p>A cada <b>' + estado.meta.alvo + ' conitos</b>, o próximo é por nossa conta.</p></div>' +
      '<div class="passos">' +
      '<div class="passo"><b>1</b><span>Compre seu conito e dê o seu <i>WhatsApp</i> na loja.</span></div>' +
      '<div class="passo"><b>2</b><span>A gente marca na hora. Você acompanha <i>por aqui</i>.</span></div>' +
      '<div class="passo"><b>3</b><span>Fechou ' + estado.meta.alvo + '? O próximo é <i>grátis</i>.</span></div>' +
      '</div>' + blocoComunidade();
  }

  function blocoComunidade(){
    if(!estado.meta.comunidade) return "";
    return '<div class="comunidade"><h3>Clube dos Conitos</h3>' +
      '<p>Um cantinho para quem não abre mão de um docinho. Novidade, promoção de membro, enquete de sabor e a Conito pertinho de você. Sem spam, só coisa boa.</p>' +
      '<div class="qr" id="qrcode"></div>' +
      '<a class="botao" href="' + escapar(estado.meta.comunidade) + '" target="_blank" rel="noopener">Entrar no Clube</a>' +
      '</div>';
  }

  function montarQR(){
    var caixa = document.getElementById("qrcode");
    if(!caixa) return;
    caixa.innerHTML = "";
    if(typeof QRCode === "undefined"){ caixa.innerHTML = '<p class="qr-aviso">QR não carregou.</p>'; return; }
    try{
      new QRCode(caixa, {text:estado.meta.comunidade, width:168, height:168,
        colorDark:"#30170F", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M});
    }catch(e){ caixa.innerHTML = '<p class="qr-aviso">QR não carregou.</p>'; }
  }

  function quando(ms){
    if(!ms) return "";
    var d = Date.now() - ms;
    if(d < 60000) return "agora há pouco";
    var min = Math.round(d/60000); if(min < 60) return "há " + min + " min";
    var hr = Math.round(min/60); if(hr < 24) return "há " + hr + "h";
    var dias = Math.round(hr/24); return dias === 1 ? "ontem" : "há " + dias + " dias";
  }

  function telaEntrar(){
    return '<h2>Bora ver quantos já?</h2><p>É só o número que você deixou com a gente.</p>' +
      '<label for="tel">Telefone com DDD</label>' +
      '<input id="tel" data-foco type="tel" inputmode="numeric" autocomplete="tel" placeholder="19 99999 9999" value="' + escapar(tela.tel||"") + '">' +
      '<button class="botao" data-acao="entrar">Ver meu cartão</button>' +
      '<button class="botao contorno" data-ir="inicio">Voltar</button>';
  }

  function telaMeu(){
    var c = meuCartao;
    if(!c){ tela = {nome:"entrar"}; return telaEntrar(); }
    return cartaoHTML(c) +
      '<p>Mostra essa tela na hora de pedir.' +
      (c.resgates ? " Você já levou " + c.resgates + (c.resgates===1?" conito grátis daqui.":" conitos grátis daqui.") : "") + '</p>' +
      '<button class="botao contorno" data-acao="sair">Esse cartão não é meu</button>';
  }

  function telaLogin(){
    return '<h2>Área do administrador</h2>' +
      '<p>Só quem cuida da loja entra aqui.</p>' +
      '<label for="usr">E-mail</label>' +
      '<input id="usr" data-foco type="email" autocomplete="username" inputmode="email" placeholder="vivi@conito.com.br" value="' + escapar(tela.usr||"") + '">' +
      '<label for="pwd">Senha</label>' +
      '<input id="pwd" type="password" autocomplete="current-password" placeholder="••••••••">' +
      '<button class="botao" data-acao="login">Entrar</button>' +
      '<button class="botao contorno" data-ir="inicio">Voltar</button>';
  }

  function itemHTML(c){
    var pronto = c.selos >= estado.meta.alvo;
    return '<li><button class="item' + (pronto?" pronto":"") + '" data-abrir="' + escapar(c.k) + '">' +
      '<span class="item-nome">' + escapar(c.nome) +
      (c.t4 ? '<span class="item-tel">•••• ' + escapar(c.t4) + '</span>' : '') + '</span>' +
      '<span class="item-num">' + Math.min(c.selos, estado.meta.alvo) + '/' + estado.meta.alvo + '</span></button></li>';
  }

  function telaLoja(){
    var busca = (tela.busca||"").toLowerCase().trim(), d = digitos(tela.busca);
    var texto = busca.replace(/[\d\s()+.-]/g, "");
    var todos = estado.clientes.slice().sort(function(a,b){ return b.em - a.em; });
    var prontos = todos.filter(function(c){ return c.selos >= estado.meta.alvo; });
    var lista = todos;
    if(busca) lista = todos.filter(function(c){
      var final = c.t4 || (c.tel ? c.tel.slice(-4) : "");
      var bateNumero = !d ||
        (d.length <= 4 ? final.indexOf(d) === 0                     // 4 últimos números (vai filtrando enquanto digita)
                       : (c.tel && c.tel.indexOf(d) >= 0) || final === d.slice(-4));
      var bateNome = !texto || c.nome.toLowerCase().indexOf(texto) >= 0;
      return bateNumero && bateNome;
    });

    var h = '<div class="barra"><h2>Administrador</h2><button class="link" data-acao="deslogar">Sair</button></div>';
    h += '<div class="resumo"><div><b>' + todos.length + '</b><span>' + (todos.length===1?"cliente":"clientes") + '</span></div>' +
         '<div class="' + (prontos.length?"destaque":"") + '"><b>' + prontos.length + '</b><span>' +
         (prontos.length===1?"já pode levar o grátis":"já podem levar o grátis") + '</span></div></div>';
    h += '<button class="botao" data-ir="novo">Cadastrar cliente</button>';

    if(prontos.length && !busca) h += '<h3>Já podem levar o grátis</h3><ul class="lista">' + prontos.map(itemHTML).join("") + '</ul>';

    h += '<label for="busca">Procurar cliente</label>' +
         '<input id="busca" type="search" placeholder="Nome, telefone ou 4 últimos números" inputmode="search" value="' + escapar(tela.busca||"") + '" data-busca>';

    if(!todos.length) h += '<p>Ninguém por aqui ainda. Na primeira venda, toque em “Cadastrar cliente”.</p>';
    else if(!lista.length) h += '<p>Não achei ninguém com esse nome ou número.</p>';
    else h += (busca ? "" : "<h3>Todo mundo</h3>") + '<ul class="lista">' + lista.slice(0,80).map(itemHTML).join("") + '</ul>';

    h += '<p class="centro"><button class="link" data-ir="ajustes">Ajustes</button></p>';
    return h;
  }

  function telaFicha(){
    var c = achar(tela.k);
    if(!c){ tela = {nome:"admin"}; return telaLoja(); }
    var h = cartaoHTML(c);
    if(c.em) h += '<p>Última marcação ' + quando(c.em) + '.</p>';
    h += '<button class="botao grande" data-acao="mais">+1 doce comprado</button>';
    if(c.selos >= estado.meta.alvo) h += '<button class="botao premio" data-acao="resgatar">Entreguei o conito grátis</button>';

    h += '<h3>Mandar no WhatsApp</h3>';
    if(!c.tel){
      h += '<p>Falta o WhatsApp completo dela. Digita aqui uma vez e fica salvo.</p>' +
           '<label for="ftel">WhatsApp com DDD</label>' +
           '<input id="ftel" type="tel" inputmode="numeric" placeholder="19 99999 9999">' +
           '<button class="botao contorno" data-acao="salvartel">Salvar WhatsApp</button>';
    }else{
      var padrao = mensagemPadrao(c);
      var texto = (tela.msg !== undefined && tela.msg !== null) ? tela.msg : padrao;
      h += '<textarea id="msg" data-msg aria-label="Mensagem">' + escapar(texto) + '</textarea>';
      h += '<a class="botao zap" id="zap" href="' + escapar(linkZap(c, texto)) + '" target="_blank" rel="noopener">Abrir WhatsApp</a>';
      if(texto !== padrao) h += '<p class="centro"><button class="link" data-acao="restaurar">Voltar ao texto de sempre</button></p>';
      h += '<p>A mensagem muda sozinha conforme o cartão enche. Dá pra editar antes de mandar.</p>';
    }

    h += '<button class="botao contorno" data-acao="menos">Tirar 1 (carimbei errado)</button>';
    h += '<button class="botao contorno" data-acao="remover">' +
         (tela.confirmaRm ? 'Toque de novo para remover mesmo' : 'Remover esta cliente') + '</button>';
    h += '<button class="botao contorno" data-ir="admin">Voltar para a lista</button>';
    return h;
  }

  function telaNovo(){
    return '<h2>Cliente nova</h2><p>Nome e WhatsApp. Só isso.</p>' +
      '<label for="nome">Nome</label>' +
      '<input id="nome" data-foco type="text" placeholder="Maria" value="' + escapar(tela.nome2||"") + '">' +
      '<label for="ntel">WhatsApp com DDD</label>' +
      '<input id="ntel" type="tel" inputmode="numeric" placeholder="19 99999 9999" value="' + escapar(tela.tel||"") + '">' +
      '<button class="botao" data-acao="criar">Cadastrar e marcar o 1º</button>' +
      '<button class="botao contorno" data-ir="admin">Voltar</button>';
  }

  function telaAjustes(){
    return '<h2>Ajustes</h2><p>Arruma uma vez e esquece.</p>' +
      '<label for="alvo">Quantos conitos para ganhar 1 grátis</label>' +
      '<input id="alvo" type="number" min="1" max="20" value="' + estado.meta.alvo + '">' +
      '<label for="lnk">Link que vai junto na mensagem (em branco = endereço deste site)</label>' +
      '<input id="lnk" type="url" placeholder="' + escapar(window.location.origin) + '" value="' + escapar(estado.meta.link||"") + '">' +
      '<label for="com">Link do Clube dos Conitos (vira o QR Code da home)</label>' +
      '<input id="com" type="url" placeholder="https://chat.whatsapp.com/..." value="' + escapar(estado.meta.comunidade||"") + '">' +
      '<h3>Sua senha</h3>' +
      '<p>Entrando como ' + escapar(emailAdm) + '.</p>' +
      '<label for="npwd">Nova senha (deixe em branco para manter a atual)</label>' +
      '<input id="npwd" type="password" autocomplete="new-password" placeholder="••••••••">' +
      '<button class="botao" data-acao="ajustar">Salvar ajustes</button>' +
      '<button class="botao contorno" data-ir="admin">Voltar</button>';
  }

  /* ---------- interação ---------- */

  document.addEventListener("input", function(e){
    if(e.target.hasAttribute && e.target.hasAttribute("data-msg")){
      tela.msg = e.target.value;
      var c = achar(tela.k), a = app.querySelector("#zap");
      if(c && a) a.setAttribute("href", linkZap(c, tela.msg));
      return;
    }
    if(!(e.target.hasAttribute && e.target.hasAttribute("data-busca"))) return;
    tela.busca = e.target.value;
    var pos = e.target.selectionStart;
    desenhar();
    var campo = app.querySelector("[data-busca]");
    if(campo){ campo.focus(); try{ campo.setSelectionRange(pos,pos); }catch(err){} }
  });

  document.addEventListener("click", async function(e){
    var alvo = e.target.closest("[data-ir],[data-acao],[data-abrir]");
    if(!alvo) return;
    if(salvando) return;

    if(alvo.hasAttribute("data-ir")){
      tela = {nome:alvo.getAttribute("data-ir"), focar:true};
      if(tela.nome === "admin" && autenticado){ carregando = true; desenhar(); await carregarClientes(); carregando = false; }
      return desenhar();
    }
    if(alvo.hasAttribute("data-abrir")){ tela = {nome:"ficha", k:alvo.getAttribute("data-abrir")}; return desenhar(); }

    var acao = alvo.getAttribute("data-acao");

    if(acao === "restaurar"){ tela.msg = null; return desenhar(); }

    if(acao === "login"){
      var u = app.querySelector("#usr").value.trim(), p = app.querySelector("#pwd").value;
      tela.usr = u;
      carregando = true; desenhar();
      var r = await sb.auth.signInWithPassword({email:u, password:p});
      if(r.error){
        carregando = false;
        recado = {texto:"E-mail ou senha não conferem."};
        return desenhar();
      }
      await verificarAdmin();
      if(autenticado){ await carregarClientes(); tela = {nome:"admin"}; }
      carregando = false;
      return desenhar();
    }

    if(acao === "deslogar"){
      await sb.auth.signOut();
      autenticado = false; estado.clientes = [];
      tela = {nome:"inicio"};
      return desenhar();
    }

    if(acao === "entrar"){
      var tel = app.querySelector("#tel").value, k = chave(tel);
      tela.tel = tel;
      if(!k){ recado = {texto:"Digita o número completo, com DDD."}; return desenhar(); }
      carregando = true; desenhar();
      var c = await consultarCartao(k);
      carregando = false;
      if(!c){ recado = {texto:"Esse número ainda não tá aqui. Na próxima compra a gente cria o seu."}; return desenhar(); }
      meuCartao = c;
      local("conito_k", k);
      tela = {nome:"meu", k:k};
      return desenhar();
    }

    if(acao === "sair"){ local("conito_k",""); meuCartao = null; tela = {nome:"entrar", focar:true}; return desenhar(); }

    if(acao === "ajustar"){
      var a = Number(app.querySelector("#alvo").value);
      var campos = {
        id:1,
        alvo: (a >= 1 && a <= 20) ? Math.round(a) : estado.meta.alvo,
        link: app.querySelector("#lnk").value.trim().slice(0,300),
        comunidade: app.querySelector("#com").value.trim().slice(0,300)
      };
      var novaSenha = app.querySelector("#npwd").value;
      salvando = true; desenhar();
      var rc = await sb.from("config").upsert(campos).select().maybeSingle();
      var avisoSenha = "";
      if(!rc.error && novaSenha){
        var rs = await sb.auth.updateUser({password:novaSenha});
        avisoSenha = rs.error ? " Mas a senha não mudou: " + rs.error.message : " A senha nova já vale.";
      }
      salvando = false;
      if(rc.error){ recado = {texto:erroTexto(rc.error)}; return desenhar(); }
      estado.meta.alvo = campos.alvo; estado.meta.link = campos.link; estado.meta.comunidade = campos.comunidade;
      tela = {nome:"admin"};
      recado = {texto:"Ajustes salvos." + avisoSenha};
      return desenhar();
    }

    if(acao === "criar"){
      var nome = app.querySelector("#nome").value.trim(), t = app.querySelector("#ntel").value, nk = chave(t);
      tela.nome2 = nome; tela.tel = t;
      if(!nome){ recado = {texto:"Falta o nome."}; return desenhar(); }
      if(!nk){ recado = {texto:"Digita o número completo, com DDD."}; return desenhar(); }
      if(achar(nk)){ recado = {texto:"Esse número já tem cartão. Procura pelo nome na lista."}; return desenhar(); }
      var limpo = telLimpo(t);
      var registro = {k:nk, nome:nome.slice(0,60), t4:limpo.slice(-4), tel:limpo,
                      selos:1, resgates:0, em:new Date().toISOString()};
      salvando = true; desenhar();
      var ri = await sb.from("clientes").insert(registro).select().single();
      salvando = false;
      if(ri.error){
        recado = {texto: ri.error.code === "23505" ? "Esse número já tem cartão. Procura pelo nome na lista." : erroTexto(ri.error)};
        return desenhar();
      }
      estado.clientes.unshift(deBanco(ri.data));
      tela = {nome:"ficha", k:nk};
      recado = {texto:"Cadastrada, com o primeiro já marcado."};
      return desenhar();
    }

    if(acao === "salvartel"){
      var c4 = achar(tela.k), ft = app.querySelector("#ftel").value;
      if(!c4) return;
      if(chave(ft) !== c4.k){ recado = {texto:"Esse número não bate com o cartão dela. Confere os dígitos."}; return desenhar(); }
      var lp = telLimpo(ft);
      return atualizar(c4.k, {tel:lp, t4:lp.slice(-4)}, "WhatsApp salvo.");
    }

    if(acao === "remover"){
      if(!tela.confirmaRm){
        tela.confirmaRm = true;
        recado = {texto:"Isso apaga o cartão dela, inclusive os selos. Toque de novo para confirmar."};
        return desenhar();
      }
      salvando = true; desenhar();
      var rd = await sb.from("clientes").delete().eq("k", tela.k);
      salvando = false;
      if(rd.error){ recado = {texto:erroTexto(rd.error)}; return desenhar(); }
      estado.clientes = estado.clientes.filter(function(x){ return x.k !== tela.k; });
      tela = {nome:"admin"};
      recado = {texto:"Cliente removida."};
      return desenhar();
    }

    if(acao === "mais"){
      var jaTem = achar(tela.k);
      if(jaTem && Date.now() - jaTem.em < 120000 && !tela.confirma){
        tela.confirma = true;
        recado = {texto:"Essa cliente foi marcada agora há pouco. Toque de novo se for mesmo outra compra."};
        return desenhar();
      }
    }

    if(acao === "mais" || acao === "menos" || acao === "resgatar"){
      var c2 = achar(tela.k), mud, texto;
      if(!c2) return;
      if(acao === "mais"){ mud = {selos:c2.selos + 1}; texto = "Marcado."; }
      else if(acao === "menos"){ mud = {selos:Math.max(0, c2.selos-1)}; texto = "Tirei um."; }
      else{
        if(c2.selos < estado.meta.alvo) return;
        mud = {selos:c2.selos - estado.meta.alvo, resgates:c2.resgates + 1};
        texto = "Conito grátis entregue. Cartão zerado.";
      }
      tela.msg = null; tela.confirma = false; tela.confirmaRm = false;
      return atualizar(c2.k, mud, texto);
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    if(e.target.id === "tel"){ e.preventDefault(); app.querySelector('[data-acao="entrar"]').click(); }
    if(e.target.id === "pwd" || e.target.id === "usr"){ e.preventDefault(); app.querySelector('[data-acao="login"]').click(); }
  });

  /* ---------- partida ---------- */

  (async function partida(){
    carregando = true; desenhar();
    try{
      await carregarConfig();
      await verificarAdmin();
      var kSalva = local("conito_k");
      if(kSalva){
        meuCartao = await consultarCartao(kSalva);
        if(meuCartao) tela = {nome:"meu", k:kSalva};
      }
    }catch(err){
      recado = {texto:"Não consegui falar com o servidor agora. Tenta recarregar a página."};
    }
    carregando = false;
    desenhar();
  })();
})();
</script>
</body>
</html>
